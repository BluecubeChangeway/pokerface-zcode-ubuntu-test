name: Visual Regression Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      
      - name: Download Storybook from GitHub Pages
        run: |
          GH_PAGES_URL="https://bluecubechangeway.github.io/pokerface-zcode-ubuntu-test/"
          echo "Downloading Storybook from $GH_PAGES_URL"
          mkdir -p storybook-static
          cd storybook-static
          wget --mirror --convert-links --adjust-extension --page-requisites --no-parent \
            --reject "index.json" \
            --execute robots=off \
            --timeout=30 --tries=3 \
            "https://bluecubechangeway.github.io/pokerface-zcode-ubuntu-test/" 2>&1 | tail -20
          # Move downloaded files to current directory
          mv bluecubechangeway.github.io/pokerface-zcode-ubuntu-test/* . 2>/dev/null || true
          cd ..
      
      - name: Start Storybook HTTP server
        run: |
          cd storybook-static
          npx http-server -p 6006 -c-1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:6006 > /dev/null; then
              echo "Storybook server ready"
              break
            fi
            sleep 1
          done
          if ! curl -s http://localhost:6006 > /dev/null; then
            echo "Server failed to start"
            kill $SERVER_PID
            exit 1
          fi
      
      - name: Run visual regression tests
        run: npm run test:visual
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:6006
      
      - name: Kill Storybook server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi
      
      - name: Upload visual test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      
      - name: Upload baseline snapshots on main
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-main
          path: tests/visual/snapshots/
          retention-days: 30